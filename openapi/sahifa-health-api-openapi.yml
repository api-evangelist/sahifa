openapi: 3.2.0
info:
  title: Sahifa Health API
  version: '2026-09-24'
  description: 'HTML to PDF and screenshot API hosted in Jeddah, Saudi Arabia. Compatible with PDFShift v3 and ScreenshotOne. Documentation: https://sahifa.dev/docs'
  contact:
    email: support@sahifa.dev
    url: https://sahifa.dev/docs
servers:
- url: https://api.sahifa.dev
  description: Jeddah (me-jeddah-1)
security:
- basicAuth: []
- apiKeyHeader: []
- accessKey: []
tags:
- name: Health
paths:
  /health:
    get:
      operationId: health
      summary: Service status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      tags:
      - Health
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: User 'api', password = your API key (PDFShift style).
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    accessKey:
      type: apiKey
      in: query
      name: access_key
      description: ScreenshotOne style.
